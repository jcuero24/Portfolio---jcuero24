<button
  class="back-to-top"
  type="button"
  (click)="scrollToTop()"
  [class.is-visible]="showBackToTop"
  [attr.aria-hidden]="!showBackToTop"
  [attr.tabindex]="showBackToTop ? 0 : -1"
  [attr.aria-label]="languageService.t('backToTop')"
  [attr.title]="languageService.t('backToTop')">
  <i class="bi bi-arrow-up" aria-hidden="true"></i>
</button>
